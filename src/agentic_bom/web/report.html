<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Agentic Security Exposure</title>
<style>
:root{--bg:#0e1117;--panel:#161b24;--panel2:#1d2430;--line:#2a3342;--text:#e6e9ef;--muted:#9aa4b5;--pe:#ff5d5d;--op:#f5a524;--bc:#4ea1ff;--inv:#8b95a7;--unk:#b07cff;--ok:#3ecf8e;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 28px 8px}h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}.scope{color:var(--muted);font-size:13px}
.banner{margin:14px 28px 0;padding:12px 16px;border-radius:8px;background:linear-gradient(90deg,#3a1720,#22161c);border:1px solid #5b2430;font-weight:600;font-size:15px}
.banner.neutral{background:var(--panel);border-color:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:14px 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.card .v{font-size:26px;font-weight:700}.card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.card.pe .v{color:var(--pe)}.card.unk .v{color:var(--unk)}
nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line)}nav button{background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.active{color:var(--text);border-bottom-color:var(--bc)}
main{padding:16px 28px 60px}.tab{display:none}.tab.active{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px}
.chip.off{opacity:.4}.chip.on{border-color:var(--bc)}
.graphwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
svg text{fill:var(--text);font-size:12px}svg .colh{fill:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.node rect{fill:var(--panel2);stroke:var(--line);rx:7}.node{cursor:pointer}.node:hover rect{stroke:var(--text)}.node.sel rect{stroke:#fff;stroke-width:2}
.node.dim,.edge.dim{opacity:.15}.node .kind{fill:var(--muted);font-size:10px}
.edge{fill:none;stroke-width:2}.edge.changed{stroke-dasharray:6 4;stroke-width:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;margin:8px 0 18px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.c-potentially_exposed{color:var(--pe)}.c-operation_path{color:var(--op)}.c-bound_capability{color:var(--bc)}.c-inventory_only{color:var(--inv)}.c-unknown{color:var(--unk)}
.s-high{color:var(--pe)}.s-medium{color:var(--op)}.s-low{color:var(--bc)}.s-info{color:var(--inv)}
.tag{font-size:11px;color:#ffd36b;margin-left:6px}
code,.mono{font-family:var(--mono);font-size:12px}
.drawer{position:fixed;top:0;right:0;width:min(620px,96vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s;overflow:auto;padding:20px 22px 40px;z-index:10;box-shadow:-20px 0 40px #0008}
.drawer.open{transform:none}.drawer h2{font-size:17px;margin:0 30px 8px 0}.drawer h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:18px 0 6px}
.close{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.chain{list-style:none;padding:0;margin:0}.chain li{padding:6px 10px;background:var(--panel2);border-radius:6px;margin:0 0 4px}.chain li .kind{color:var(--muted);font-size:11px;margin-right:8px;text-transform:uppercase}
.chain .arrow{color:var(--muted);font-size:11px;padding-left:12px;background:none;margin:0}
.ev{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin:0 0 6px}.ev .loc{color:var(--bc)}.ev .det{color:var(--muted);font-size:11px;margin-left:8px}.ev pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12px;color:#cfd6e3}
.kv{display:grid;grid-template-columns:200px 1fr;gap:4px 12px}.kv div:nth-child(odd){color:var(--muted)}
.unk-list li{color:#d9c6ff}.muted{color:var(--muted)}.cmd{background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:6px;font-family:var(--mono);font-size:12px;user-select:all}
.note{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Agentic Security Exposure</h1>
  <div class="scope" id="scope"></div>
</header>
<div id="banner"></div>
<section class="cards" id="cards"></section>
<nav id="nav"></nav>
<main>
  <section class="tab" id="tab-graph">
    <div class="chips" id="chips"></div>
    <div class="legend" id="legend"></div>
    <div class="graphwrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <h3 class="muted" style="margin-top:18px;font-size:12px;text-transform:uppercase;letter-spacing:.7px">Capability paths</h3>
    <table id="pathtable"></table>
  </section>
  <section class="tab" id="tab-drift"></section>
  <section class="tab" id="tab-bom"></section>
  <section class="tab" id="tab-coverage"></section>
</main>
<aside class="drawer" id="drawer"><button class="close" id="close" aria-label="Close">×</button><div id="dbody"></div></aside>
<script id="aem-data" type="application/json">__AEM_DATA__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("aem-data").textContent);
const H = D.head, G = H.graph;
const N = {}; G.nodes.forEach(n => N[n.id] = n);
const CLASS_COLOR = {potentially_exposed:"var(--pe)",operation_path:"var(--op)",bound_capability:"var(--bc)",inventory_only:"var(--inv)",unknown:"var(--unk)"};
const RANK = {unknown:0.5,inventory_only:0,bound_capability:1,operation_path:2,potentially_exposed:3};
const CLASS_LABEL = {potentially_exposed:"potentially exposed",operation_path:"operation path",bound_capability:"bound capability",inventory_only:"inventory only",unknown:"unknown"};

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.appendChild(typeof k === "string" || typeof k === "number" ? document.createTextNode(String(k)) : k); }
  return e;
}
function svg(tag, attrs, ...kids){
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) { if (k == null) continue; e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); }
  return e;
}
const badge = (cls) => el("span", {class:"badge c-" + cls}, CLASS_LABEL[cls] || cls);
const sev = (s) => el("span", {class:"badge s-" + s}, s);
const nm = (id) => id && N[id] ? N[id].name : (id || "—");
const trunc = (s, n) => (s && s.length > n) ? s.slice(0, n - 1) + "…" : (s || "");

// ---------------- changed paths (diff mode)
const changed = new Set();
const removedPaths = [];
if (D.drift) {
  D.drift.findings.forEach(f => {
    if (["new_bound_sensitive_operation","operation_target_expanded","review_required"].includes(f.kind) && f.new && f.new.key) changed.add(f.new.key);
    if (f.kind === "new_untrusted_to_privileged_path" && f.new && f.new.affected_paths) H.paths.forEach(p => { if (f.new.affected_paths.includes(p.id)) changed.add(p.key); });
    if (f.kind === "capability_removed" && f.old && f.old.key && !f.new) removedPaths.push(f.old);
  });
}

// ---------------- header
document.getElementById("scope").textContent =
  `Scope: ${H.scope.label} · ${H.coverage.python_files_analyzed} Python files analysed · static analysis of supported Python patterns only (see Coverage) · ${H.tool.name} ${H.tool.version}` +
  (D.drift ? ` · comparing ${D.drift.base.label} → ${D.drift.head.label}` : "");
const bannerBox = document.getElementById("banner");
if (D.drift) {
  const txt = D.drift.banner || `Agentic BOM ${D.drift.bom_delta.status} · no new sensitive operation paths`;
  bannerBox.appendChild(el("div", {class: "banner" + (D.drift.banner ? "" : " neutral")}, txt));
}
const S = H.summary;
const cards = [
  ["Confirmed agents", S.agents_confirmed, ""], ["Bound tools", S.bound_tools, ""],
  ["Sensitive operation paths", S.sensitive_operation_paths, ""], ["Potentially exposed", S.potentially_exposed_paths, "pe"], ["Unknown paths", S.unknown_paths, "unk"]];
const cardBox = document.getElementById("cards");
cards.forEach(([k,v,c]) => cardBox.appendChild(el("div", {class:"card " + c}, el("div",{class:"v"}, v), el("div",{class:"k"}, k))));

// ---------------- tabs
const tabs = [["graph","Exposure graph"]].concat(D.drift ? [["drift","Compare revisions"]] : []).concat([["bom","Inventory (BOM)"],["coverage","Coverage & limits"]]);
const nav = document.getElementById("nav");
function show(t){ document.querySelectorAll(".tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + t)); nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.t === t)); }
tabs.forEach(([t,l]) => { const b = el("button", {onclick: () => show(t)}, l); b.dataset.t = t; nav.appendChild(b); });
show("graph");

// ---------------- drawer
const drawer = document.getElementById("drawer"), dbody = document.getElementById("dbody");
document.getElementById("close").onclick = () => drawer.classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.classList.remove("open"); });
function evidenceList(evs){
  if (!evs || !evs.length) return el("div",{class:"muted"},"No evidence recorded.");
  return el("div", null, evs.map(e => el("div",{class:"ev"}, el("span",{class:"loc mono"}, `${e.file}:${e.line_start}${e.line_end !== e.line_start ? "-" + e.line_end : ""}`), el("span",{class:"det"}, e.detector_id + (e.note ? " · " + e.note : "")), e.snippet ? el("pre", null, e.snippet) : null)));
}
function kv(pairs){ const d = el("div",{class:"kv"}); pairs.forEach(([k,v]) => { d.appendChild(el("div",null,k)); d.appendChild(el("div",{class:"mono"}, v == null || v === "" ? "—" : (Array.isArray(v) ? (v.length ? v.join(", ") : "—") : String(v)))); }); return d; }
function chainList(p){
  const ul = el("ul",{class:"chain"});
  p.nodes.forEach((id, i) => {
    if (i) { const e = p.edges.find(e => e.target === id && p.nodes.indexOf(e.source) < i) || {}; ul.appendChild(el("li",{class:"arrow"}, "↓ " + (e.type || "") + (e.resolution && e.resolution !== "confirmed_static" ? ` (${e.resolution})` : ""))); }
    ul.appendChild(el("li", null, el("span",{class:"kind"}, N[id] ? N[id].kind : "?"), nm(id)));
  });
  return ul;
}
function openPath(p, title){
  dbody.replaceChildren();
  dbody.appendChild(el("h2", null, title || `${p.entry_name || "unbound"} → ${p.tool_name || "?"} → ${p.operation_callee || "?"}`));
  dbody.appendChild(el("div", null, badge(p.classification), " ", sev(p.severity), " ", el("span",{class:"badge muted"}, p.resolution), changed.has(p.key) ? el("span",{class:"tag"},"changed in this revision") : null));
  dbody.appendChild(el("h3", null, "Why this classification"));
  dbody.appendChild(el("div", null, p.exposure_reason));
  dbody.appendChild(el("h3", null, "Exact chain"));
  dbody.appendChild(chainList(p));
  dbody.appendChild(el("h3", null, "Known vs unknown"));
  dbody.appendChild(kv([
    ["Operation", `${p.operation_category || "—"} · ${p.operation_callee || "—"}`],
    ["Target", p.operation_target ? `${p.operation_target} (${p.operation_target_kind})` : "unresolved"],
    ["Target controlled by params", p.controlling_params],
    ["Content-only params", p.content_params],
    ["Guard status", p.guard_status],
    ["Untrusted → privileged instr.", p.untrusted_privileged_input ? "yes (" + (p.untrusted_sources || []).join(", ") + ")" : "no"],
    ["Untrusted in user message", p.user_role_untrusted_input ? "yes" : "no / not found"],
    ["Instruction provenance", p.instructions_provenance],
    ["Helper chain", (p.via || []).map(v => v.callee)],
    ["runtime_observed", "false (static analysis only)"],
    ["authorization_verified", "false (IAM / OAuth not analysed)"],
  ]));
  dbody.appendChild(el("h3", null, "Unknowns / limitations"));
  dbody.appendChild(p.unknowns && p.unknowns.length ? el("ul",{class:"unk-list"}, p.unknowns.map(u => el("li",null,u))) : el("div",{class:"muted"},"None recorded within the supported scope (this does not prove absence of other paths)."));
  dbody.appendChild(el("h3", null, "Evidence (file:line)"));
  dbody.appendChild(evidenceList(p.evidence));
  dbody.appendChild(el("h3", null, "Remediation"));
  dbody.appendChild(el("div", null, p.remediation));
  dbody.appendChild(el("h3", null, "Retest"));
  dbody.appendChild(el("div",{class:"cmd"}, D.commands.retest));
  drawer.classList.add("open");
}
function openFinding(f){
  dbody.replaceChildren();
  dbody.appendChild(el("h2", null, f.title));
  dbody.appendChild(el("div", null, sev(f.severity), " ", el("span",{class:"badge muted"}, f.rule_id), " ", el("span",{class:"badge muted"}, f.kind), f.gate_eligible ? el("span",{class:"tag"},"CI-gate eligible") : null));
  dbody.appendChild(el("h3", null, "Finding"));
  dbody.appendChild(el("div", null, f.message));
  dbody.appendChild(kv([["Finding ID", f.id], ["BOM delta", f.bom_delta], ["Security delta", f.security_delta], ["Subject", f.subject]]));
  if (f.changed_fields) dbody.appendChild(kv([["Changed fields", f.changed_fields], ["Params added", f.parameters_added], ["Params removed", f.parameters_removed], ["Review status", f.review_status]]));
  if (f.old && f.old.description !== undefined) { dbody.appendChild(el("h3",null,"Old description")); dbody.appendChild(el("div",{class:"ev"}, el("pre",null,f.old.description || "(empty)"))); dbody.appendChild(el("h3",null,"New description")); dbody.appendChild(el("div",{class:"ev"}, el("pre",null,f.new.description || "(empty)"))); }
  [["Before", f.old], ["After", f.new]].forEach(([lbl, side]) => {
    dbody.appendChild(el("h3", null, lbl));
    if (!side) { dbody.appendChild(el("div",{class:"muted"},"absent")); return; }
    if (side.classification) dbody.appendChild(el("div", null, badge(side.classification), " ", side.exposure_reason || ""));
    if (side.instructions_provenance) dbody.appendChild(kv([["Instruction provenance", side.instructions_provenance]]));
    if (side.unknowns && side.unknowns.length) dbody.appendChild(el("ul",{class:"unk-list"}, side.unknowns.map(u => el("li",null,u))));
    if (side.evidence) dbody.appendChild(evidenceList(side.evidence));
  });
  dbody.appendChild(el("h3", null, "Guidance"));
  dbody.appendChild(el("div", null, f.guidance));
  dbody.appendChild(el("h3", null, "Explain / retest"));
  dbody.appendChild(el("div",{class:"cmd"}, `agentic-bom explain ${f.id} --report security-drift.json`));
  drawer.classList.add("open");
}

// ---------------- graph
const COLS = [["data_source","Untrusted input"],["agent","Agents"],["mcp_server","MCP servers"],["tool","Tools (capabilities)"],["operation","Sensitive operations"],["resource","Resources"]];
const FILTERS = {agent:true, mcp_server:true, tool:true, operation:true, data_source:true, resource:true};
let changedOnly = false, selected = null;
const pathEdges = new Map();  // edgeKey -> worst class
const edgeChanged = new Set();
const shown = new Set();
H.paths.forEach(p => {
  p.nodes.forEach(n => shown.add(n));
  p.edges.forEach(e => {
    if (!N[e.source] || !N[e.target] || N[e.source].kind === "prompt" || N[e.target].kind === "trust_boundary") return;
    const k = e.source + "\u0000" + e.target, cur = pathEdges.get(k);
    if (cur === undefined || RANK[p.classification] > RANK[cur]) pathEdges.set(k, p.classification);
    if (changed.has(p.key)) edgeChanged.add(k);
  });
});
G.edges.forEach(e => {
  if (["BINDS_TOOL","CONNECTS_MCP","EXPOSES_TOOL"].includes(e.type)) { shown.add(e.source); shown.add(e.target); const k = e.source + "\u0000" + e.target; if (!pathEdges.has(k)) pathEdges.set(k, null); }
});
G.nodes.forEach(n => { if (n.kind === "agent" || (n.kind === "tool")) shown.add(n.id); });

const chipBox = document.getElementById("chips");
[["agent","Agent"],["mcp_server","MCP"],["tool","Capability"],["operation","Sensitive operation"],["data_source","Trust boundary"]].forEach(([k,l]) => {
  const c = el("button",{class:"chip on", onclick: () => { FILTERS[k] = !FILTERS[k]; c.classList.toggle("off", !FILTERS[k]); c.classList.toggle("on", FILTERS[k]); drawGraph(); }}, l);
  chipBox.appendChild(c);
});
if (D.drift) { const c = el("button",{class:"chip", onclick: () => { changedOnly = !changedOnly; c.classList.toggle("on", changedOnly); drawGraph(); renderPaths(); }}, "Changed paths"); chipBox.appendChild(c); }
const legend = document.getElementById("legend");
Object.entries(CLASS_LABEL).forEach(([k,l]) => { const i = el("i"); i.style.background = CLASS_COLOR[k]; legend.appendChild(el("span",null,i,l)); });
legend.appendChild(el("span",null,"— dashed: changed in this revision · grey: binding only (no sensitive operation)"));

function drawGraph(){
  const g = document.getElementById("graph"); g.replaceChildren();
  const cols = COLS.filter(([k]) => FILTERS[k] && [...shown].some(id => N[id] && N[id].kind === k));
  const W = 210, GAP = 70, RH = 58, TOP = 40;
  const byCol = cols.map(([k]) => [...shown].filter(id => N[id] && N[id].kind === k).sort());
  const pos = {};
  byCol.forEach((ids, ci) => ids.forEach((id, ri) => pos[id] = {x: 20 + ci * (W + GAP), y: TOP + ri * RH}));
  const height = TOP + Math.max(1, ...byCol.map(c => c.length)) * RH + 10;
  const width = 40 + cols.length * (W + GAP) - GAP;
  g.setAttribute("width", Math.max(width, 600)); g.setAttribute("height", height);
  cols.forEach(([k,l], ci) => g.appendChild(svg("text",{x: 20 + ci * (W + GAP), y: 22, class:"colh"}, l)));
  const selPaths = selected ? H.paths.filter(p => p.nodes.includes(selected)) : null;
  for (const [k, cls] of pathEdges) {
    const [s, t] = k.split("\u0000");
    if (!pos[s] || !pos[t]) continue;
    const a = pos[s], b = pos[t], x1 = a.x + W, y1 = a.y + 20, x2 = b.x, y2 = b.y + 20, mx = (x1 + x2) / 2;
    const p = svg("path",{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, class:"edge" + (edgeChanged.has(k) ? " changed" : "")});
    p.style.stroke = cls ? CLASS_COLOR[cls] : "#3a4456";
    let on = !changedOnly || edgeChanged.has(k);
    if (selPaths) on = on && selPaths.some(pp => pp.edges.some(e => e.source === s && e.target === t));
    if (!on) p.classList.add("dim");
    g.appendChild(p);
  }
  Object.entries(pos).forEach(([id, p]) => {
    const n = N[id];
    const grp = svg("g",{class:"node" + (selected === id ? " sel" : ""), transform:`translate(${p.x},${p.y})`});
    const r = svg("rect",{width: W, height: 40, rx: 7});
    if (n.resolution === "unknown" || n.resolution === "unsupported") r.style.strokeDasharray = "4 3";
    grp.appendChild(r);
    grp.appendChild(svg("text",{x:10, y:16, class:"kind"}, n.kind + (n.resolution !== "confirmed_static" ? " · " + n.resolution : "")));
    grp.appendChild(svg("text",{x:10, y:32}, trunc(n.name, 28)));
    grp.appendChild(svg("title", null, `${n.name}\n${n.id}`));
    let on = true;
    if (selPaths) on = selPaths.some(pp => pp.nodes.includes(id)) || id === selected;
    if (changedOnly) on = on && H.paths.some(pp => changed.has(pp.key) && pp.nodes.includes(id));
    if (!on) grp.classList.add("dim");
    grp.addEventListener("click", () => { selected = selected === id ? null : id; drawGraph(); renderPaths(); });
    g.appendChild(grp);
  });
}
function firstOpEv(p){ const e = (p.evidence || []).filter(e => e.detector_id.startsWith("py.sensitive-op")); return e.length ? e[e.length - 1] : (p.evidence || [])[0]; }
function renderPaths(){
  const t = document.getElementById("pathtable"); t.replaceChildren();
  t.appendChild(el("tr", null, ["Class","Severity","Agent / entry","Tool","Operation","Target","Guard","Location"].map(h => el("th", null, h))));
  let ps = H.paths.slice().sort((a,b) => RANK[b.classification] - RANK[a.classification] || a.key.localeCompare(b.key));
  if (selected) ps = ps.filter(p => p.nodes.includes(selected));
  if (changedOnly) ps = ps.filter(p => changed.has(p.key));
  if (!ps.length) { t.appendChild(el("tr",null, el("td",{colspan:"8", class:"muted"}, "No capability paths to sensitive operations found within the supported scope."))); return; }
  ps.forEach(p => {
    const ev = firstOpEv(p);
    t.appendChild(el("tr",{class:"click", onclick: () => openPath(p)},
      el("td", null, badge(p.classification), changed.has(p.key) ? el("span",{class:"tag"},"changed") : null),
      el("td", null, sev(p.severity)), el("td", null, p.entry_name || "unbound"), el("td", null, p.tool_name || "—"),
      el("td", {class:"mono"}, p.operation_callee || "—"), el("td",{class:"mono"}, trunc(p.operation_target || "", 40)),
      el("td", null, p.guard_status), el("td",{class:"mono"}, ev ? `${ev.file}:${ev.line_start}` : "—")));
  });
}
drawGraph(); renderPaths();

// ---------------- drift tab
if (D.drift) {
  const box = document.getElementById("tab-drift"), dd = D.drift;
  box.appendChild(el("h3", null, "Agentic BOM delta"));
  box.appendChild(kv([["Status", dd.bom_delta.status], ["Added", dd.bom_delta.added], ["Removed", dd.bom_delta.removed], ["Modified", dd.bom_delta.modified.map(m => `${m.id}.${m.field}: ${m.old} → ${m.new}`)], ["Compared", dd.bom_delta.compared]]));
  box.appendChild(el("h3", null, "Security-semantic findings"));
  const t = el("table"); box.appendChild(t);
  t.appendChild(el("tr", null, ["Severity","Rule","Kind","Finding","BOM","Security delta"].map(h => el("th", null, h))));
  if (!dd.findings.length) t.appendChild(el("tr",null, el("td",{colspan:"6",class:"muted"},"No security-semantic changes detected within the supported scope.")));
  dd.findings.forEach(f => t.appendChild(el("tr",{class:"click", onclick: () => openFinding(f)}, el("td",null,sev(f.severity)), el("td",{class:"mono"},f.rule_id), el("td",null,f.kind), el("td",null,f.message), el("td",null,f.bom_delta), el("td",{class:"mono"},f.security_delta))));
  box.appendChild(el("div",{class:"note"}, dd.statement));
}

// ---------------- BOM tab
(function(){
  const box = document.getElementById("tab-bom");
  const table = (title, heads, rows) => { box.appendChild(el("h3", null, title)); const t = el("table"); t.appendChild(el("tr",null, heads.map(h => el("th",null,h)))); if (!rows.length) t.appendChild(el("tr",null, el("td",{colspan:String(heads.length), class:"muted"},"none found"))); rows.forEach(r => t.appendChild(el("tr",null, r.map(c => el("td",{class:"mono"}, c == null ? "—" : String(c)))))); box.appendChild(t); };
  const out = (id, type) => G.edges.filter(e => e.source === id && e.type === type).map(e => nm(e.target));
  const inn = (id, type) => G.edges.filter(e => e.target === id && e.type === type).map(e => nm(e.source));
  const ev0 = n => n.evidence[0] ? `${n.evidence[0].file}:${n.evidence[0].line_start}` : "";
  table("Agents", ["Name","Framework","Model","Instructions provenance","Tools","MCP","Management","Location"], G.nodes.filter(n => n.kind === "agent").map(n => [n.name, n.attributes.framework, n.attributes.model, n.attributes.instructions_provenance, out(n.id,"BINDS_TOOL").join(", "), out(n.id,"CONNECTS_MCP").join(", "), n.attributes.management_status, ev0(n)]));
  table("Tools", ["Name","Framework","Bound by","Exposed by","Parameters","Contract fp","Resolution","Location"], G.nodes.filter(n => n.kind === "tool").map(n => [n.name, n.attributes.framework, inn(n.id,"BINDS_TOOL").join(", "), inn(n.id,"EXPOSES_TOOL").join(", "), (n.attributes.parameters || []).join(", "), n.attributes.contract ? n.attributes.contract.fingerprint.slice(0,12) : "", n.resolution, ev0(n)]));
  table("MCP servers", ["Name","Source","Transport / command","Resolution","Location"], G.nodes.filter(n => n.kind === "mcp_server").map(n => [n.name, n.attributes.source, n.attributes.command || n.attributes.transport || "", n.resolution, ev0(n)]));
  table("Models", ["Model"], G.nodes.filter(n => n.kind === "model").map(n => [n.name]));
  table("Packages", ["Package","Version spec","Imported in code","AI-related","Manifest"], G.nodes.filter(n => n.kind === "package").map(n => [n.name, n.attributes.version_spec || "(unpinned)", n.attributes.imported_in_code, n.attributes.ai_related, ev0(n)]));
  box.appendChild(el("div",{class:"note"},"Licence/compliance analysis is out of scope for this revision. Prompt bodies and environment values are never stored."));
})();

// ---------------- coverage tab
(function(){
  const box = document.getElementById("tab-coverage"), C = H.coverage;
  box.appendChild(el("div",{class:"banner neutral", style:"margin:0 0 12px"}, C.statement));
  box.appendChild(el("h3", null, "Supported matrix"));
  box.appendChild(kv(Object.entries(C.supported_matrix.languages).concat(Object.entries(C.supported_matrix.frameworks))));
  box.appendChild(el("h3", null, "Scan scope"));
  box.appendChild(kv([["Python files analysed", C.python_files_analyzed], ["Parse errors", C.parse_errors.map(e => `${e.file} (${e.error})`)], ["Excluded test files", C.excluded_test_files], ["Skipped large files", C.skipped_large_files], ["Skipped symlinks", C.skipped_symlinks], ["Other languages present (not analysed)", Object.entries(C.unsupported_languages_present).map(([k,v]) => `${k}: ${v} files`)], ["Helper depth limit", C.analysis_limits.max_helper_depth]]));
  box.appendChild(el("h3", null, "Unknowns (never classified as safe)"));
  const t = el("table"); t.appendChild(el("tr",null,["Kind","Location","Reason"].map(h => el("th",null,h))));
  if (!C.unknowns.length) t.appendChild(el("tr",null, el("td",{colspan:"3",class:"muted"},"none recorded")));
  C.unknowns.forEach(u => t.appendChild(el("tr",null, el("td",null,u.kind), el("td",{class:"mono"},`${u.file}:${u.line}`), el("td",null,u.reason))));
  box.appendChild(t);
  box.appendChild(el("h3", null, "Sensitive operations not reachable from any agent/tool (not attributed to agents)"));
  const t2 = el("table"); t2.appendChild(el("tr",null,["Operation","Category","Function","Location"].map(h => el("th",null,h))));
  if (!C.unreached_sensitive_operations.length) t2.appendChild(el("tr",null, el("td",{colspan:"4",class:"muted"},"none")));
  C.unreached_sensitive_operations.forEach(u => t2.appendChild(el("tr",null, el("td",{class:"mono"},u.callee), el("td",null,u.category), el("td",{class:"mono"},u.function), el("td",{class:"mono"},`${u.file}:${u.line}`))));
  box.appendChild(t2);
})();
})();

name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: agentic-bom demo --scenario all --out out/demo
      - run: agentic-bom benchmark run --out out/bench
      - name: CI gate behaves as documented
        shell: bash
        run: |
          set +e
          agentic-bom diff examples/same-bom-new-exposure/baseline examples/same-bom-new-exposure/candidate --out out/g1 --fail-on high --no-html; a=$?
          agentic-bom diff examples/same-bom-new-exposure/candidate examples/same-bom-new-exposure/fixed --out out/g2 --fail-on high --no-html; b=$?
          test "$a" = 1 && test "$b" = 0
